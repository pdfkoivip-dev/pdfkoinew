<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JPG to PDF Pin 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1500px; overflow: hidden; }
  body {
    font-family: "Segoe UI", -apple-system, Arial, sans-serif;
    background: #f8fafc;
    position: relative;
    color: #0f172a;
  }
  /* soft violet wash in the lower third */
  .wash {
    position: absolute; left: 0; right: 0; bottom: 0; height: 560px;
    background: linear-gradient(180deg, rgba(168,85,247,0) 0%, rgba(168,85,247,0.10) 55%, rgba(10,132,255,0.08) 100%);
  }
  .wrap { position: absolute; inset: 0; padding: 72px 70px 56px; display: flex; flex-direction: column; }

  /* ---------- Hook ---------- */
  .hook { margin-top: 26px; }
  .hook .line1 { font-size: 60px; font-weight: 700; letter-spacing: -1px; color: #334155; }
  .hook .line2 { font-size: 86px; font-weight: 900; letter-spacing: -2.5px; line-height: 1.06; margin-top: 14px; }
  .hook .line2 em { font-style: normal; color: #A855F7; }
  .hook .sub { margin-top: 26px; font-size: 36px; font-weight: 600; color: #64748b; letter-spacing: -0.3px; }

  /* ---------- Center visual ---------- */
  .stage { flex: 1; display: flex; align-items: center; justify-content: space-between; margin-top: 10px; position: relative; }

  .pile { position: relative; width: 380px; height: 460px; flex: none; }
  .photo {
    position: absolute; width: 210px; height: 270px; background: #fff;
    border-radius: 14px; box-shadow: 0 14px 34px rgba(15,23,42,0.16);
    padding: 12px; border: 1px solid #e2e8f0;
  }
  .photo .img { width: 100%; height: 196px; border-radius: 8px; }
  .photo .tag { margin-top: 10px; font-size: 21px; font-weight: 700; color: #64748b; letter-spacing: 1px; }
  .p1 { left: 6px;  top: 96px;  transform: rotate(-9deg); z-index: 1; }
  .p2 { left: 52px; top: 40px;  transform: rotate(-3deg); z-index: 2; }
  .p3 { left: 104px; top: 118px; transform: rotate(5deg);  z-index: 3; }
  .p4 { left: 150px; top: 30px;  transform: rotate(10deg); z-index: 4; }
  .g1 { background: linear-gradient(135deg, #7dd3fc, #0A84FF); }
  .g2 { background: linear-gradient(135deg, #fda4af, #f97316); }
  .g3 { background: linear-gradient(135deg, #86efac, #10b981); }
  .g4 { background: linear-gradient(135deg, #c4b5fd, #A855F7); }

  .arrowbox { flex: none; width: 190px; text-align: center; margin: 0 4px; }
  .arrowbox .cap { font-size: 26px; color: #64748b; font-weight: 600; margin-bottom: 14px; }
  .arrowbox svg { display: block; margin: 0 auto; }

  .pdfcard {
    flex: none; width: 300px; height: 420px; background: #fff; border-radius: 18px;
    box-shadow: 0 22px 48px rgba(15,23,42,0.20); border: 1px solid #e2e8f0;
    position: relative; padding: 26px 24px;
  }
  .pdfcard .corner {
    position: absolute; top: 0; right: 0; width: 0; height: 0;
    border-top: 46px solid #ede9fe; border-left: 46px solid transparent;
    border-top-right-radius: 18px;
  }
  .pdfcard .badge {
    display: inline-block; background: #A855F7; color: #fff; font-weight: 800;
    font-size: 26px; letter-spacing: 2px; padding: 8px 18px; border-radius: 10px;
  }
  .pages { margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
  .page {
    height: 88px; border-radius: 10px; background: #f1f5f9; border: 1px solid #e2e8f0;
    display: flex; align-items: center; padding: 0 18px; gap: 16px;
  }
  .page .num {
    width: 44px; height: 44px; border-radius: 50%; background: #0A84FF; color: #fff;
    font-weight: 800; font-size: 24px; display: flex; align-items: center; justify-content: center; flex: none;
  }
  .page .lines { flex: 1; }
  .page .lines i { display: block; height: 9px; border-radius: 5px; background: #cbd5e1; margin-bottom: 9px; }
  .page .lines i:last-child { width: 62%; margin-bottom: 0; }

  /* ---------- Trust strip ---------- */
  .trust { display: flex; justify-content: center; gap: 44px; margin-top: 34px; }
  .trust .item { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 700; color: #334155; }
  .trust .dot {
    width: 34px; height: 34px; border-radius: 50%; background: #10b981; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .trust .dot svg { display: block; }

  /* ---------- CTA ---------- */
  .cta {
    margin-top: 40px; height: 116px; border-radius: 58px;
    background: linear-gradient(90deg, #A855F7, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 40px rgba(168,85,247,0.35);
  }
  .cta span { color: #fff; font-size: 46px; font-weight: 800; letter-spacing: -0.5px; }

  /* ---------- Footer ---------- */
  .foot { margin-top: 30px; text-align: right; font-size: 28px; color: #94a3b8; font-weight: 600; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="wrap">

    <div class="hook">
      <div class="line1">Got a pile of photos?</div>
      <div class="line2">Turn them into <em>one PDF.</em></div>
      <div class="sub">JPG to PDF converter, online and free.</div>
    </div>

    <div class="stage">
      <div class="pile">
        <div class="photo p1"><div class="img g1"></div><div class="tag">JPG</div></div>
        <div class="photo p2"><div class="img g2"></div><div class="tag">JPG</div></div>
        <div class="photo p3"><div class="img g3"></div><div class="tag">JPG</div></div>
        <div class="photo p4"><div class="img g4"></div><div class="tag">JPG</div></div>
      </div>

      <div class="arrowbox">
        <div class="cap">drag to set order</div>
        <svg width="170" height="86" viewBox="0 0 170 86">
          <path d="M6 43 H118" stroke="#A855F7" stroke-width="14" stroke-linecap="round"/>
          <path d="M112 12 L162 43 L112 74 Z" fill="#A855F7"/>
        </svg>
      </div>

      <div class="pdfcard">
        <div class="corner"></div>
        <span class="badge">PDF</span>
        <div class="pages">
          <div class="page"><div class="num">1</div><div class="lines"><i></i><i></i></div></div>
          <div class="page"><div class="num">2</div><div class="lines"><i></i><i></i></div></div>
          <div class="page"><div class="num">3</div><div class="lines"><i></i><i></i></div></div>
        </div>
      </div>
    </div>

    <div class="trust">
      <div class="item"><span class="dot"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9.5 L7 13.5 L15 4.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Free</div>
      <div class="item"><span class="dot"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9.5 L7 13.5 L15 4.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>No signup</div>
      <div class="item"><span class="dot"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9.5 L7 13.5 L15 4.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Runs in your browser</div>
    </div>

    <div class="cta"><span>Combine your photos free&nbsp;&nbsp;→</span></div>

    <div class="foot">pdfkoi.com</div>
  </div>
</body>
</html>
